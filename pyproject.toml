[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "openalex-local-api"
version = "0.6.0rc4"
license = "MIT"
readme = "README.md"
description = "Local OpenAlex search, complete records, and citation service"
requires-python = ">=3.10"
dependencies = ["fastapi==0.116.1", "uvicorn==0.35.0", "httpx==0.28.1", "orjson==3.11.3", "psutil==7.0.0"]
[project.optional-dependencies]
arxiv-duckdb = ["duckdb>=1.1,<2"]

[project.scripts]
oa = "openalex_api.cli:main"
[tool.setuptools.packages.find]
include = ["openalex_api*"]
[tool.setuptools.package-data]
openalex_api = ["static/*", "resources/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
