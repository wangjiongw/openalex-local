name: Publish tagged package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pytest build
      - run: python -m pytest -q
      - run: python -m build
      - name: Check tag and generate checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os, openalex_api; assert os.environ["TAG"] == "v" + openalex_api.__version__'
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt --verify-tag --title "$TAG" --notes-file "docs/releases/$TAG.md"
